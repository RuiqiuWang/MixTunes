<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#f7f7f8">
  <title>MixTunes</title>
  <link rel="stylesheet" href="styles.css">
  <script src="runtime.js" defer></script>
  <script src="ui.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="app-bar"><strong>MixTunes</strong><button id="toggle-theme" class="icon" aria-label="切换深色模式" title="切换深色模式">☾</button></header>
    <button id="retry-connect" class="connection" hidden>未连接，点此重试</button>
    <main id="main-content">
      <section id="screen-library" class="screen" aria-label="歌单">
        <div class="page-heading"><button id="choose-playlist" class="playlist-heading" aria-label="选择歌单"><span id="playlist-title">我的歌单</span><span aria-hidden="true">⌄</span></button><button id="open-import">导入</button></div>
        <div class="list-tools"><input id="library-filter" type="search" placeholder="筛选歌单" aria-label="筛选歌单"><span id="queue-count">0 首</span></div>
        <div id="song-list" class="song-list"></div>
        <div id="library-empty" class="empty"><p id="empty-label">还没有歌曲</p><button id="empty-import">粘贴链接导入</button></div>
      </section>
      <section id="screen-search" class="screen" aria-label="全平台搜索" hidden>
        <h1>全平台搜索</h1>
        <form id="search-form" class="search-form"><input id="search-query" type="search" placeholder="歌名或作者" aria-label="歌名或作者" maxlength="100" required><button id="search-submit" class="primary" type="submit">搜索</button></form>
        <div id="search-tabs" class="tabs" aria-label="搜索平台"><button data-search-platform="all" class="active" aria-pressed="true">全部</button><button data-search-platform="qq" aria-pressed="false">QQ</button><button data-search-platform="netease" aria-pressed="false">网易</button><button data-search-platform="bilibili" aria-pressed="false">B 站</button></div>
        <div id="search-results"><div class="empty">输入歌名或作者</div></div>
      </section>
      <section id="screen-settings" class="screen" aria-label="设置" hidden>
        <div class="page-heading"><h1>账号与设置</h1><button id="refresh-accounts">刷新</button></div>
        <div id="account-list"></div>
        <section class="settings-card"><h2>从电脑导入</h2><p>连接同一 Wi-Fi，粘贴电脑上的临时分享链接。</p><form id="transfer-form" class="transfer-form"><input id="transfer-url" type="url" inputmode="url" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="http://192.168.1.2:8787/mix-transfer/…" aria-label="电脑分享链接" required><button id="transfer-submit" class="primary" type="submit">导入所有歌单</button></form></section>
        <section class="settings-card"><h2>本地备份</h2><p>歌单可以在手机和电脑间导入。登录信息单独保存。</p><p id="import-status" role="status" aria-live="polite"></p><div class="button-pair"><button id="import-file">导入文件</button><button id="export-library">导出备份</button></div></section>
        <p class="settings-footnote">平台可用音质取决于账号和音源。</p>
      </section>
      <section id="screen-lyrics" class="screen lyrics-screen" aria-label="歌词" hidden>
        <div class="lyrics-heading"><button id="close-lyrics" class="icon" aria-label="返回">‹</button><h1>歌词</h1><button id="lyrics-follow" hidden>回到当前</button></div>
        <h2 id="lyrics-title"></h2><p id="lyrics-artist" class="lyrics-meta"></p><p id="lyrics-source" class="lyrics-meta"></p>
        <p id="lyrics-message" class="lyrics-message" role="status"></p><button id="lyrics-retry" hidden>重新读取</button><div id="lyrics-lines" class="lyrics-lines"></div>
      </section>
    </main>
    <section id="player" class="player" aria-label="播放控制">
      <div class="now-playing"><button id="open-lyrics" aria-label="打开当前歌曲歌词"><span id="current-cover" class="cover small" aria-hidden="true">♫</span></button><button id="current-more" class="current-meta" aria-label="当前歌曲操作"><span id="current-title">选择歌曲播放</span><span id="current-detail"> </span></button><button id="current-video" hidden>视频</button></div>
      <div class="seek-row"><span id="position">0:00</span><input id="seek" type="range" min="0" max="1" value="0" step="100" aria-label="播放进度" disabled><span id="duration">0:00</span></div>
      <div class="transport"><button id="cycle-mode" aria-label="播放模式：顺序播放">→ 顺序</button><button id="previous" class="icon" aria-label="上一首">Ⅰ‹</button><button id="play-pause" class="main-play" aria-label="播放">▶</button><button id="next" class="icon" aria-label="下一首">›Ⅰ</button><button id="edit-range">片段</button></div>
      <div class="volume-row"><button id="mute" class="icon" aria-label="静音">◖))</button><input id="volume" type="range" min="0" max="1" value="0.7" step="0.01" aria-label="音量"><span id="volume-value">70%</span></div>
    </section>
    <nav class="bottom-nav" aria-label="主导航"><button data-screen="library" class="active" aria-current="page">歌单</button><button data-screen="search">搜索</button><button data-screen="settings">设置</button></nav>
  </div>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden><span id="notice-text"></span><button id="dismiss-notice" class="icon" aria-label="关闭提示">×</button></div>
  <div id="sheet-layer" class="sheet-layer" hidden><button id="sheet-scrim" class="sheet-scrim" aria-label="关闭弹层"></button><section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"><header><h2 id="sheet-title"></h2><button id="close-sheet" class="icon" aria-label="关闭弹层">×</button></header><div id="sheet-body"></div></section></div>
</body>
</html>
